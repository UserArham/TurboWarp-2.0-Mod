name: JSON CI Checker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json-check:
    name: Validate all JSON files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate all JSON files
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          files = sorted(
              p for p in Path(".").rglob("*.json")
              if ".git" not in p.parts
          )

          if not files:
              print("No JSON files found.")
              sys.exit(1)

          errors = []

          for file in files:
              try:
                  with file.open(encoding="utf-8") as f:
                      json.load(f)
                  print(f"PASS: {file}")
              except (json.JSONDecodeError, UnicodeDecodeError) as e:
                  errors.append((file, e))
                  print(f"FAIL: {file}: {e}")

          print(f"\nChecked: {len(files)} JSON files")
          print(f"Failed: {len(errors)} JSON files")

          if errors:
              sys.exit(1)

          print("All JSON files are valid!")
          PY
